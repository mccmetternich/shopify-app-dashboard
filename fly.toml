# Fly.io configuration. Nothing in the application is Fly-specific, but two
# constraints here are real wherever you deploy: exactly one instance, and
# migrations on release.
#
# Rename `app` to something you own, or deploy with `fly deploy -a <your-app>`,
# which overrides it.

app = 'densologie-scoreboard'
primary_region = 'lax'

[build]

[env]
  APP_NAME = "Densologie"
  PUBLIC_BASE_URL = "https://densologie-scoreboard.fly.dev"
  # Real client IP comes in via this Fly-injected header. Rate limiting keys on it.
  TRUSTED_CLIENT_IP_HEADER = "Fly-Client-IP"
  # Scheduler is live; poll intervals are set per-API via secrets when tokens arrive.
  NO_SCHEDULER = ""

[deploy]
  release_command = 'python -m app_dashboard.migrate'

[http_service]
  internal_port = 8080
  force_https = true
  # One instance, always. Two means two APScheduler instances, so duplicate
  # polls and duplicate Slack alerts. Do not scale this out.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
