[project]
name = "shopify-app-dashboard"
version = "0.1.0"
description = "Unofficial self-hosted analytics for your own Shopify app, from the Partner API. Not affiliated with Shopify Inc."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Kurt Elster" }]
keywords = ["shopify", "partner-api", "analytics", "mrr", "churn", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "httpx",
    "psycopg[binary]",
    "apscheduler",
    "pydantic-settings",
    "google-analytics-data>=0.23.0",
    "itsdangerous>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/kgelster/shopify-app-dashboard"
Source = "https://github.com/kgelster/shopify-app-dashboard"
Issues = "https://github.com/kgelster/shopify-app-dashboard/issues"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_dashboard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
